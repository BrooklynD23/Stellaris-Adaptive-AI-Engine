[project]
name = "sae"
version = "0.1.0"
description = "Stellaris Adaptive Engine: adaptive AI companion for modded Stellaris"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "psutil>=5.9"]

[project.scripts]
sae = "sae.cli:main"

[project.optional-dependencies]
telemetry = [
    "rerun-sdk==0.39.0",
]
console = [
    "duckdb>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "ruff>=0.5", "types-psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sae"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["context", "sae-handoff", "parser/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
