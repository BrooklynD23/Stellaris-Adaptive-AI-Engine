name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      T7_E2E_FULL: "1"  # full seed matrix on Linux only; unset on Windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Sync
        run: uv sync --all-extras
      - name: Build parser
        working-directory: parser
        run: cargo build --release -j 1
      - name: pytest with coverage (single full run, line coverage gate)
        run: uv run pytest -q --cov --cov-fail-under=90
      - name: mypy
        run: uv run mypy --strict src
      - name: ruff
        run: uv run ruff check
      - name: CI-1 collected
        run: test "$(uv run pytest tests/e2e/test_ci1.py --co -q | grep -c '::' || true)" -gt 0
      - name: CI-3 collected
        run: |
          n=$(uv run pytest tests/unit/t5 -k "ci3 or ram_ramp or fault_spike or no_flapping or random_traces" --co -q | grep -c "::" || true)
          echo "collected $n"
          test "$n" -gt 0
      - name: CI-4 collected
        run: test "$(uv run pytest tests/integration/test_ci4_*.py --co -q | grep -c '::' || true)" -gt 0
      - name: CI-5 collected
        run: test "$(uv run pytest tests/e2e/test_ci5.py --co -q | grep -c '::' || true)" -gt 0

  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -j 1 -- -D warnings
      - run: cargo test -j 1
      - run: rustup target add x86_64-pc-windows-gnu
      - run: cargo check -j 1 --target x86_64-pc-windows-gnu

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: uv sync --all-extras
      - name: Build parser
        working-directory: parser
        run: cargo build --release -j 1
      - name: Rust tests
        working-directory: parser
        run: |
          cargo test -j 1
          cargo clippy -j 1 -- -D warnings
      - run: uv run pytest -q
      - run: uv run mypy --strict src
      - run: uv run ruff check
